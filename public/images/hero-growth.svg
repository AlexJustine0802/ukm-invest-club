<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Growing market chart</title>
  <desc id="desc">A blue financial chart rising across a city skyline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#144dc8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#144dc8" stop-opacity=".04"/>
    </linearGradient>
  </defs>
  <rect width="960" height="620" fill="url(#bg)"/>
  <polygon points="655,620 960,620 960,110 780,125" fill="#bfdbfe" opacity=".62"/>
  <g fill="#93c5fd" opacity=".45">
    <rect x="388" y="314" width="34" height="228" rx="4"/>
    <rect x="452" y="250" width="44" height="292" rx="4"/>
    <rect x="540" y="190" width="42" height="352" rx="4"/>
    <rect x="622" y="232" width="38" height="310" rx="4"/>
    <rect x="700" y="146" width="48" height="396" rx="4"/>
    <rect x="800" y="210" width="40" height="332" rx="4"/>
  </g>
  <polygon points="360,520 430,460 500,486 570,402 642,440 710,340 790,380 888,240 960,190 960,620 360,620" fill="url(#fade)"/>
  <polyline points="360,520 430,460 500,486 570,402 642,440 710,340 790,380 888,240 960,190" fill="none" stroke="#144dc8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Inter, Arial, sans-serif" font-weight="800">
    <text x="388" y="342" font-size="28" fill="#16a34a">+8.3%</text>
    <text x="560" y="212" font-size="28" fill="#16a34a">+12.5%</text>
    <text x="780" y="176" font-size="28" fill="#144dc8">+17.6%</text>
  </g>
</svg>
