<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Research dashboard</title>
  <desc id="desc">Laptop dashboard with charts, bars, and a magnifying glass.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset=".7" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
  </defs>
  <rect width="960" height="620" fill="url(#bg)"/>
  <rect x="220" y="150" width="560" height="330" rx="24" fill="#0f172a"/>
  <rect x="250" y="182" width="500" height="266" rx="12" fill="#123f8f"/>
  <g fill="#60a5fa">
    <rect x="290" y="342" width="36" height="74" rx="5"/>
    <rect x="350" y="290" width="36" height="126" rx="5"/>
    <rect x="410" y="238" width="36" height="178" rx="5"/>
    <rect x="470" y="314" width="36" height="102" rx="5"/>
  </g>
  <polyline points="550,390 594,332 635,358 676,270 724,226" fill="none" stroke="#93c5fd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="625" cy="355" r="92" fill="none" stroke="#e0f2fe" stroke-width="16" opacity=".78"/>
  <line x1="690" y1="420" x2="786" y2="516" stroke="#0f274b" stroke-width="22" stroke-linecap="round"/>
  <rect x="170" y="480" width="640" height="34" rx="17" fill="#1e293b"/>
  <g font-family="Inter, Arial, sans-serif" font-weight="800" fill="#fff">
    <text x="284" y="232" font-size="30">Insight Today</text>
    <text x="284" y="270" font-size="30">Better Decisions Tomorrow</text>
  </g>
</svg>
